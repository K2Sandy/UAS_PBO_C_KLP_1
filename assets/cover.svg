<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="KasirResto - Aplikasi Kasir Restoran Berbasis CLI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="0.55" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <pattern id="titik" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.12"/>
    </pattern>
    <filter id="bayang" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#450a0a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#titik)"/>
  <circle cx="1180" cy="-40" r="190" fill="#ffffff" opacity="0.07"/>
  <circle cx="80" cy="400" r="160" fill="#000000" opacity="0.08"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <text x="88" y="118" font-size="22" font-weight="600" letter-spacing="4" opacity="0.85">UAS PRAKTIKUM PBO C · KELOMPOK 1</text>
    <text x="84" y="200" font-size="92" font-weight="800" letter-spacing="-2">KasirResto</text>
    <text x="88" y="246" font-size="26" opacity="0.92">Aplikasi kasir restoran berbasis CLI dengan Java</text>

    <g font-size="18" font-weight="700">
      <rect x="88" y="278" width="104" height="38" rx="19" fill="#ffffff" opacity="0.18"/>
      <text x="140" y="303" text-anchor="middle">Java 17</text>
      <rect x="204" y="278" width="72" height="38" rx="19" fill="#ffffff" opacity="0.18"/>
      <text x="240" y="303" text-anchor="middle">CLI</text>
      <rect x="288" y="278" width="88" height="38" rx="19" fill="#ffffff" opacity="0.18"/>
      <text x="332" y="303" text-anchor="middle">OOP</text>
      <rect x="388" y="278" width="96" height="38" rx="19" fill="#ffffff" opacity="0.18"/>
      <text x="436" y="303" text-anchor="middle">MIT</text>
      <text x="508" y="303" font-weight="500" opacity="0.85">Informatika · Universitas Syiah Kuala</text>
    </g>
  </g>

  <g transform="translate(930 52) rotate(4)" filter="url(#bayang)">
    <path d="M0 0 H230 V246 l-19.2 14 -19.2 -14 -19.2 14 -19.2 -14 -19.2 14 -19.2 -14 -19.2 14 -19.2 -14 -19.2 14 -19.2 -14 -19.2 14 -19.2 -14 Z" fill="#FFF7ED"/>
    <g font-family="'Courier New', Consolas, monospace" fill="#7F1D1D">
      <text x="115" y="38" font-size="17" font-weight="700" text-anchor="middle">STRUK</text>
      <line x1="20" y1="54" x2="210" y2="54" stroke="#7F1D1D" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="22" y="84" font-size="14">Nasi Goreng</text>
      <text x="208" y="84" font-size="14" text-anchor="end">40.000</text>
      <text x="22" y="110" font-size="14">Jus Jeruk L</text>
      <text x="208" y="110" font-size="14" text-anchor="end">14.000</text>
      <text x="22" y="136" font-size="14">Pajak 10%</text>
      <text x="208" y="136" font-size="14" text-anchor="end">5.400</text>
      <line x1="20" y1="154" x2="210" y2="154" stroke="#7F1D1D" stroke-width="2" stroke-dasharray="6 5"/>
      <text x="22" y="184" font-size="16" font-weight="700">TOTAL</text>
      <text x="208" y="184" font-size="16" font-weight="700" text-anchor="end">59.400</text>
      <text x="115" y="222" font-size="12" text-anchor="middle" opacity="0.75">Terima kasih!</text>
    </g>
  </g>
